<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Lantern</title>
<meta name="description" content="Your cursor is the only light. Lead a crowd of frightened villagers through the dark. The game narrates your mistakes.">
<style>
  html, body { margin: 0; height: 100%; background: #06070e; overflow: hidden; overscroll-behavior: none; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: none;
           user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
</style>
</head>
<body>
<canvas id="game" aria-label="Lantern game"></canvas>
<script>
(() => {
'use strict';

// ---------------------------------------------------------------------------
// Canvas & scaling (fixed 540x960 logical playfield, letterboxed to any size
// so it behaves inside an iframe embed of any dimensions)
// ---------------------------------------------------------------------------
const W = 540, H = 960;
const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
let scale = 1, offX = 0, offY = 0, dpr = 1;

function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  const cw = window.innerWidth, ch = window.innerHeight;
  cv.width = Math.round(cw * dpr);
  cv.height = Math.round(ch * dpr);
  scale = Math.min(cw / W, ch / H);
  offX = (cw - W * scale) / 2;
  offY = (ch - H * scale) / 2;
}
window.addEventListener('resize', resize);
resize();

// Offscreen darkness layer (logical resolution; the gradients are soft so 1x is plenty)
const dark = document.createElement('canvas');
dark.width = W; dark.height = H;
const dctx = dark.getContext('2d');

// ---------------------------------------------------------------------------
// Helpers
// ---------------------------------------------------------------------------
const TAU = Math.PI * 2;
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const pick = arr => arr[(Math.random() * arr.length) | 0];
function hash(a) {
  a |= 0;
  a = Math.imul(a ^ (a >>> 16), 0x45d9f3b);
  a = Math.imul(a ^ (a >>> 16), 0x45d9f3b);
  a ^= a >>> 16;
  return (a >>> 0) / 4294967296;
}
const dist = (a, b) => Math.hypot(a.l - b.l, a.p - b.p);
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* storage blocked */ } },
};
const shadeCache = new Map();
function shade(hex, amt) {
  const key = hex + amt;
  let c = shadeCache.get(key);
  if (c) return c;
  const n = parseInt(hex.slice(1), 16);
  let r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  if (amt >= 0) { r += (255 - r) * amt; g += (255 - g) * amt; b += (255 - b) * amt; }
  else { r *= 1 + amt; g *= 1 + amt; b *= 1 + amt; }
  c = `rgb(${r | 0},${g | 0},${b | 0})`;
  shadeCache.set(key, c);
  return c;
}
function mixHex(a, b, t) {
  const x = parseInt(a.slice(1), 16), y = parseInt(b.slice(1), 16);
  const r = lerp((x >> 16) & 255, (y >> 16) & 255, t), g = lerp((x >> 8) & 255, (y >> 8) & 255, t), bl = lerp(x & 255, y & 255, t);
  return `rgb(${r | 0},${g | 0},${bl | 0})`;
}

// ---------------------------------------------------------------------------
// Audio (all synthesized, no asset files)
// ---------------------------------------------------------------------------
let actx = null, master = null, noiseBuf = null, droneGain = null;
let muted = store.get('ln_muted', false);

function initAudio() {
  if (actx) { if (actx.state === 'suspended') actx.resume(); return; }
  try {
    actx = new (window.AudioContext || window.webkitAudioContext)();
    master = actx.createGain();
    master.gain.value = muted ? 0 : 0.5;
    master.connect(actx.destination);
    noiseBuf = actx.createBuffer(1, actx.sampleRate, actx.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    // Low drone that swells when the dark gets close (filter breathes slowly)
    droneGain = actx.createGain();
    droneGain.gain.value = 0;
    const lp = actx.createBiquadFilter();
    lp.type = 'lowpass'; lp.frequency.value = 140; lp.Q.value = 3;
    const lfo = actx.createOscillator(); lfo.type = 'sine'; lfo.frequency.value = 0.06;
    const lfoG = actx.createGain(); lfoG.gain.value = 70; lfo.connect(lfoG); lfoG.connect(lp.frequency); lfo.start();
    lp.connect(droneGain); droneGain.connect(master);
    [[55, 'sawtooth'], [55.6, 'sawtooth'], [27.5, 'sine']].forEach(([f, ty]) => {
      const o = actx.createOscillator(); o.type = ty; o.frequency.value = f; o.connect(lp); o.start();
    });
    music.init();
    // Wind bed
    const ws = actx.createBufferSource(); ws.buffer = noiseBuf; ws.loop = true;
    const wf = actx.createBiquadFilter(); wf.type = 'bandpass'; wf.frequency.value = 420; wf.Q.value = 0.6;
    const wg = actx.createGain(); wg.gain.value = 0.035;
    ws.connect(wf); wf.connect(wg); wg.connect(master); ws.start();
  } catch (e) { actx = null; }
}
function tone(freq, dur, type = 'square', vol = 0.2, slide = 0, delay = 0) {
  if (!actx) return;
  const t = actx.currentTime + delay;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type;
  o.frequency.setValueAtTime(freq, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, freq * slide), t + dur);
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(master);
  o.start(t); o.stop(t + dur + 0.02);
}
function noise(dur, vol = 0.3, freq = 1000, q = 1, type = 'bandpass', delay = 0) {
  if (!actx) return;
  const t = actx.currentTime + delay;
  const s = actx.createBufferSource();
  s.buffer = noiseBuf;
  const f = actx.createBiquadFilter();
  f.type = type; f.frequency.setValueAtTime(freq, t); f.Q.value = q;
  const g = actx.createGain();
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  s.connect(f); f.connect(g); g.connect(master);
  s.start(t, Math.random() * 0.5); s.stop(t + dur + 0.02);
}
const sfx = {
  yelp() { tone(rand(520, 680), 0.18, 'triangle', 0.12, 1.4); },
  scream() { tone(720, 0.5, 'sawtooth', 0.14, 0.35); noise(0.4, 0.12, 2400, 2); },
  fall() { tone(380, 0.35, 'triangle', 0.14, 0.3); noise(0.25, 0.2, 500, 1, 'lowpass', 0.2); },
  grab() { noise(0.25, 0.3, 240, 1.5, 'lowpass'); tone(90, 0.3, 'sawtooth', 0.15, 0.6); },
  burn() { noise(0.35, 0.25, 3200, 0.8); tone(240, 0.3, 'square', 0.06, 2.2); },
  chime() { tone(880, 0.18, 'sine', 0.12); tone(1320, 0.3, 'sine', 0.1, 1, 0.1); },
  bell() { tone(660, 0.6, 'triangle', 0.12, 0.98); tone(1980, 0.4, 'sine', 0.04, 0.98); },
  nip() { tone(1200, 0.05, 'square', 0.08, 0.7); tone(900, 0.05, 'square', 0.08, 0.7, 0.06); },
  salt() { noise(0.3, 0.2, 5000, 0.5); },
  tick() { tone(rand(1800, 2400), 0.018, 'square', 0.022); },
  buy() { tone(523, 0.1, 'square', 0.08); tone(784, 0.16, 'square', 0.08, 1, 0.08); },
  nope() { tone(160, 0.14, 'square', 0.08, 0.7); },
  arrive() { [392, 494, 587, 784].forEach((f, i) => tone(f, 0.4, 'triangle', 0.1, 1, i * 0.14)); },
  lose() { [330, 262, 220, 165].forEach((f, i) => tone(f, 0.6, 'triangle', 0.16, 0.97, i * 0.25)); },
  boss() { [73, 69, 65].forEach((f, i) => tone(f, 0.7, 'sawtooth', 0.18, 1, i * 0.35)); },
};
function setMuted(m) { muted = m; store.set('ln_muted', m); if (master) master.gain.value = m ? 0 : 0.5; }

// Procedural score: A Phrygian pad that leans on the tritone as dread rises, a
// wandering music-box line with echo, inharmonic bells, knocks in the wood.
const music = {
  ready: false, noteT: 2, bellT: 6, knockT: 10, tension: 0, last: 4,
  SCALE: [110, 116.54, 130.81, 146.83, 164.81, 174.61, 196, 220, 233.08, 261.63],
  init() {
    const c = actx;
    // echo bus
    this.wet = c.createGain(); this.wet.gain.value = 0.6;
    const delay = c.createDelay(1.0); delay.delayTime.value = 0.41;
    const fb = c.createGain(); fb.gain.value = 0.48;
    const fbLp = c.createBiquadFilter(); fbLp.type = 'lowpass'; fbLp.frequency.value = 1800;
    this.wet.connect(delay); delay.connect(fbLp); fbLp.connect(fb); fb.connect(delay); fb.connect(master);
    // pad: root + fifth, plus tension voices (minor second, tritone) that fade in with dread
    const padLp = c.createBiquadFilter(); padLp.type = 'lowpass'; padLp.frequency.value = 420; padLp.Q.value = 1.2;
    const padLfo = c.createOscillator(); padLfo.frequency.value = 0.045; const padLfoG = c.createGain(); padLfoG.gain.value = 260;
    padLfo.connect(padLfoG); padLfoG.connect(padLp.frequency); padLfo.start();
    this.padG = c.createGain(); this.padG.gain.value = 0.0;
    padLp.connect(this.padG); this.padG.connect(master);
    const voice = (f, det, g, type = 'sawtooth') => {
      const o = c.createOscillator(); o.type = type; o.frequency.value = f; o.detune.value = det;
      const gg = c.createGain(); gg.gain.value = g; o.connect(gg); gg.connect(padLp); o.start(); return gg;
    };
    voice(110, -6, 0.35); voice(110, 7, 0.35); voice(164.81, 4, 0.25); voice(55, 0, 0.3, 'triangle');
    this.tenseA = voice(116.54, 0, 0.0); this.tenseB = voice(155.56, -5, 0.0); this.tenseC = voice(233.08, 9, 0.0);
    this.ready = true;
  },
  note(f, dur, vol, pan, type = 'triangle') {
    const c = actx, t = c.currentTime;
    const o = c.createOscillator(); o.type = type; o.frequency.value = f;
    const o2 = c.createOscillator(); o2.type = 'sine'; o2.frequency.value = f * 2; o2.detune.value = rand(-8, 8);
    const g = c.createGain(); g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + Math.min(0.5, dur * 0.3));
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    const g2 = c.createGain(); g2.gain.value = 0.25;
    const p = c.createStereoPanner ? c.createStereoPanner() : null;
    o.connect(g); o2.connect(g2); g2.connect(g);
    if (p) { p.pan.value = pan; g.connect(p); p.connect(master); p.connect(this.wet); } else { g.connect(master); g.connect(this.wet); }
    o.start(t); o2.start(t); o.stop(t + dur + 0.05); o2.stop(t + dur + 0.05);
  },
  bell(f, vol, pan) {
    const c = actx, t = c.currentTime;
    const parts = [[1, 1], [2.76, 0.35], [5.4, 0.12]];
    const p = c.createStereoPanner ? c.createStereoPanner() : null;
    const out = c.createGain(); out.gain.value = vol;
    if (p) { p.pan.value = pan; out.connect(p); p.connect(master); p.connect(this.wet); } else { out.connect(master); out.connect(this.wet); }
    for (const [r, a] of parts) {
      const o = c.createOscillator(); o.type = 'sine'; o.frequency.value = f * r; o.detune.value = rand(-6, 6);
      const g = c.createGain(); g.gain.setValueAtTime(a, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 2.8 / r);
      o.connect(g); g.connect(out); o.start(t); o.stop(t + 3);
    }
  },
  knock() {
    const n = 2 + (Math.random() < 0.3 ? 1 : 0);
    for (let i = 0; i < n; i++) noise(0.07, 0.22, 380, 1.2, 'lowpass', i * rand(0.14, 0.22));
  },
  update(dt) {
    if (!this.ready) return;
    const t = actx.currentTime;
    const playing = G.state === 'play' && !paused;
    const dread = playing ? G.dread : 0;
    const siege = playing && holdActive() ? 0.45 : 0;
    const target = clamp(Math.max(dread, siege) + (G.gust.phase === 'blow' && playing ? 0.3 : 0), 0, 1);
    this.tension += (target - this.tension) * Math.min(1, dt * 1.5);
    const quiet = G.state === 'title' || G.state === 'shop' || G.state === 'over' || G.state === 'ending';
    this.padG.gain.setTargetAtTime(quiet ? 0.16 : 0.24, t, 1.5);
    this.tenseA.gain.setTargetAtTime(this.tension * 0.3, t, 0.8);
    this.tenseB.gain.setTargetAtTime(Math.max(0, this.tension - 0.35) * 0.4, t, 0.8);
    this.tenseC.gain.setTargetAtTime(Math.max(0, this.tension - 0.6) * 0.3, t, 0.5);
    // melody: a slow random walk that drifts home; faster and lower when tense
    this.noteT -= dt;
    if (this.noteT <= 0) {
      const S = this.SCALE;
      let i = this.last + pick([-2, -1, -1, 0, 1, 1, 2, 3]);
      if (Math.random() < 0.18) i = 0;
      if (this.tension > 0.5 && Math.random() < 0.4) i = pick([1, 8]);
      i = clamp(i, 0, S.length - 1); this.last = i;
      const dur = this.tension > 0.5 ? rand(1.2, 2.2) : rand(2.5, 4.5);
      this.note(S[i] * (Math.random() < 0.15 ? 0.5 : 1), dur, quiet ? 0.045 : 0.07, rand(-0.6, 0.6));
      this.noteT = quiet ? rand(4, 7) : lerp(rand(2.2, 4.5), rand(0.9, 1.6), this.tension);
    }
    // bells: rare, high, slightly wrong
    this.bellT -= dt;
    if (this.bellT <= 0) {
      this.bellT = rand(9, 22) * (quiet ? 1.5 : 1);
      this.bell(pick([440, 466.2, 523.3, 587.3, 659.3, 880]) * (Math.random() < 0.3 ? 1.03 : 1), 0.05, rand(-0.8, 0.8));
    }
    // knocks: only when something is out there
    this.knockT -= dt;
    if (this.knockT <= 0) {
      this.knockT = rand(7, 16);
      if (playing && G.monsters.length) this.knock();
    }
  },
};
function setDrone(level) { if (droneGain) droneGain.gain.setTargetAtTime(clamp(level, 0, 1) * 0.26, actx.currentTime, 0.4); }

// ---------------------------------------------------------------------------
// Ground space & isometric projection
// Simulation runs in ground coords (l, p): l lateral (screen x), p progress
// (down the road). Iso axes (u, v) relate as l = u - v, p = u + v.
// Screen: sx = l - cam.l + W/2, sy = (p - cam.p)/2 + FOCUS_Y - height.
// ---------------------------------------------------------------------------
const FOCUS_Y = 400, PANEL_H = 150;
const cam = { l: 0, p: 0 };
function toScreen(l, p, h = 0) { return { x: l - cam.l + W / 2, y: (p - cam.p) / 2 + FOCUS_Y - h }; }
function toGround(sx, sy) { return { l: sx - W / 2 + cam.l, p: (sy - FOCUS_Y) * 2 + cam.p }; }

function poly(pts, col) {
  ctx.fillStyle = col;
  ctx.beginPath();
  ctx.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
  ctx.closePath();
  ctx.fill();
}
// Corner offsets of an iso footprint with half-extents a (u) and b (v):
// A top (-a+b, -a-b) · B right (a+b, a-b) · C bottom (a-b, a+b) · D left (-a-b, -a+b)   [dl, dp]
function isoBox(l, p, a, b, h, col, baseH = 0, alpha = 1) {
  const s = toScreen(l, p);
  const cx = s.x, cy = s.y;
  const A = [cx + (-a + b), cy + (-a - b) / 2], B = [cx + (a + b), cy + (a - b) / 2];
  const C = [cx + (a - b), cy + (a + b) / 2], D = [cx + (-a - b), cy + (-a + b) / 2];
  const y0 = -baseH, y1 = -baseH - h;
  if (alpha < 1) ctx.globalAlpha = alpha;
  poly([[D[0], D[1] + y1], [C[0], C[1] + y1], [C[0], C[1] + y0], [D[0], D[1] + y0]], shade(col, -0.1));
  poly([[C[0], C[1] + y1], [B[0], B[1] + y1], [B[0], B[1] + y0], [C[0], C[1] + y0]], shade(col, -0.34));
  poly([[A[0], A[1] + y1], [B[0], B[1] + y1], [C[0], C[1] + y1], [D[0], D[1] + y1]], shade(col, 0.16));
  if (alpha < 1) ctx.globalAlpha = 1;
}
function isoPyramid(l, p, a, b, h, col, baseH = 0) {
  const s = toScreen(l, p);
  const cx = s.x, cy = s.y - baseH;
  const B = [cx + (a + b), cy + (a - b) / 2], C = [cx + (a - b), cy + (a + b) / 2], D = [cx + (-a - b), cy + (-a + b) / 2];
  const apex = [cx, cy - h];
  poly([apex, D, C], shade(col, -0.06));
  poly([apex, C, B], shade(col, -0.36));
}
function groundEllipse(l, p, r, col, stroke, dash) {
  const s = toScreen(l, p);
  ctx.save();
  ctx.translate(s.x, s.y); ctx.scale(1, 0.5);
  ctx.beginPath(); ctx.arc(0, 0, r, 0, TAU);
  if (col) { ctx.fillStyle = col; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = 2; if (dash) ctx.setLineDash(dash); ctx.stroke(); }
  ctx.restore();
}

// ---------------------------------------------------------------------------
// Input — the pointer IS the lantern
// ---------------------------------------------------------------------------
const pointer = { x: W / 2, y: H * 0.45 };
function toLogical(e) {
  const r = cv.getBoundingClientRect();
  return { x: clamp((e.clientX - r.left - offX) / scale, 0, W), y: clamp((e.clientY - r.top - offY) / scale, 0, H) };
}
cv.addEventListener('pointermove', e => { const p = toLogical(e); pointer.x = p.x; pointer.y = p.y; });
cv.addEventListener('pointerdown', e => {
  initAudio();
  const p = toLogical(e);
  pointer.x = p.x; pointer.y = p.y;
  try { cv.setPointerCapture(e.pointerId); } catch (_) { /* ignore */ }
  onClick(p.x, p.y);
});
cv.addEventListener('contextmenu', e => e.preventDefault());
window.addEventListener('keydown', e => {
  if (e.key === 'm' || e.key === 'M') { setMuted(!muted); N.ev('mute'); }
  if (e.key === 'p' || e.key === 'P' || e.key === 'Escape') { if (paused) paused = false; else pause(); }
});

// ---------------------------------------------------------------------------
// Names & pronouns (the narrator is on a first-name basis)
// ---------------------------------------------------------------------------
const NAMES = ['Ada', 'Bram', 'Cass', 'Dov', 'Edie', 'Finn', 'Greta', 'Hal', 'Ines', 'Jory', 'Kit', 'Lou', 'Mabel', 'Ned',
  'Orla', 'Pim', 'Quill', 'Rue', 'Sol', 'Tam', 'Una', 'Vesper', 'Wren', 'Yael', 'Zed', 'Alder', 'Bea', 'Cole', 'Dill',
  'Elm', 'Fen', 'Gus', 'Hattie', 'Ivo', 'June', 'Kip', 'Lark', 'Moss', 'Nell', 'Pip', 'Rowan', 'Sage', 'Teddy',
  'Ursa', 'Vi', 'Wil', 'Ash', 'Birch', 'Clem', 'Dot', 'Eli', 'Flo', 'Gil', 'Hob', 'Ike', 'Jem', 'Lyle', 'Min', 'Nan',
  'Oz', 'Posy', 'Reg', 'Sid', 'Tess', 'Vic', 'Walt', 'Yan', 'Thomas', 'Agnes', 'Bartle', 'Maud'];
const PRON = [{ s: 'he', o: 'him', p: 'his', was: 'was' }, { s: 'she', o: 'her', p: 'her', was: 'was' }, { s: 'they', o: 'them', p: 'their', was: 'were' }];
let nameBag = [];
function nextName() {
  if (!nameBag.length) nameBag = NAMES.slice().sort(() => Math.random() - 0.5);
  return nameBag.pop();
}
const CLOAKS = ['#6b5a7a', '#5a6b4a', '#7a5a4a', '#4a5a6b', '#6b6b4a', '#7a4a5a', '#5a5a5a', '#4a6b6b'];
const SKINS = ['#d9b08c', '#c9956a', '#a8765a', '#e8c4a0', '#8a5a3c'];

// ---------------------------------------------------------------------------
// Narrator — watches, remembers, comments
// ---------------------------------------------------------------------------
const N = {
  cur: null, queue: [], shown: 0, hold: 0, alpha: 0, lastKey: {},
  cool: {},
  mem: null,
  reset() {
    this.mem = { lost: 0, taken: 0, fell: 0, ditch: {}, panics: 0, rescues: 0, perfect: 0, levels: 0, lostTimes: [], saltUsed: 0, dogs: 0, idleCount: 0, calls: 0, relics: {}, gusts: 0, seen: 0 };
    this.cur = null; this.queue = []; this.alpha = 0; this.cool = {}; this.lastKey = {};
  },
  say(text, pri = 1) {
    if (!text) return;
    const line = { text, pri };
    if (!this.cur || this.cur.done || pri >= this.cur.pri) {
      if (this.cur && !this.cur.done && pri > this.cur.pri && this.cur.pri >= 2) this.queue.unshift(this.cur);
      this.show(line);
    } else {
      if (this.queue.length < 2) this.queue.push(line);
      else if (pri > this.queue[this.queue.length - 1].pri) this.queue[this.queue.length - 1] = line;
    }
  },
  show(line) { this.cur = line; this.shown = 0; this.hold = 0; this.cur.done = false; this.alpha = 1; },
  ev(key, d = {}) {
    const now = G.time;
    const cd = COOLDOWN[key] || 0;
    if (cd && this.cool[key] != null && now - this.cool[key] < cd) return;
    const fn = LINES[key];
    if (!fn) return;
    const r = fn(d, this.mem);
    if (!r) return;
    let text, pri = PRI[key] || 1;
    if (Array.isArray(r)) {
      let opts = r.filter(x => x !== this.lastKey[key]);
      if (!opts.length) opts = r;
      text = pick(opts);
    } else text = r;
    this.lastKey[key] = text;
    this.cool[key] = now;
    this.say(fill(text, d), pri);
  },
  update(dt) {
    if (!this.cur) return;
    const c = this.cur;
    if (!c.done) {

function genLevel(n) {

      k++;

      if (jp < 60 && Math.abs(jl - lat(0)) < 110) continue;
      const prob = d < PATH_HW + 80 ? 0.32 : 0.72;
      const r = hash(seed + k * 3 + 2);
      if (r < prob) {
        const t = { l: jl, p: jp, s: 0.75 + hash(seed + k * 7) * 0.6, kind: hash(seed + k * 11) < 0.82 ? 'fir' : 'bare', rad: 7 };
        trees.push(t);
        const key = ((jl / CELL) | 0) + ',' + ((jp / CELL) | 0);
        if (!grid.has(key)) grid.set(key, []);
        grid.get(key).push(t);
      } else if (r < prob + 0.04 && d > PATH_HW + 20) {
        rocks.push({ l: jl, p: jp, a: 4 + hash(seed + k) * 5, b: 4 + hash(seed + k + 1) * 5, h: 4 + hash(seed + k + 2) * 5 });
      }
    }

    rocks.push({ l: lat(p) + (hash(seed + 901 + i * 2) - 0.5) * PATH_HW * 1.6, p, a: 5 + hash(seed + i) * 4, b: 5 + hash(seed + i + 5) * 4, h: 5 + hash(seed + i + 9) * 5 });

    const r = 26 + hash(seed + 700 + i) * 14;

    ditches.push({ l: lat(p) + off, p, r, id: i });
  }

  const nr = n <= 8 ? 2 : 1;
  for (let i = 0; i < nr; i++) {
    const idx = ((n - 1) * 2 + i) % RELIC_ORDER.length;
    const p = lerp(200, len - 200, (i + 0.3 + hash(seed + 1000 + i) * 0.4) / nr);
    const side = hash(seed + 1100 + i) < 0.5 ? -1 : 1;
    relics.push({ kind: RELIC_ORDER[idx], l: lat(p) + side * (PATH_HW - 30 + hash(seed + 1200 + i) * 50), p, seen: false });
  }

  for (let i = 0; i < nf; i++) {
    const p = lerp(300, len - 300, (i + 0.2 + hash(seed + 1300 + i) * 0.6) / nf);

    const p = Math.round(lerp(0.28, 0.86, (i + 0.5 + (hash(seed + 2000 + i) - 0.5) * 0.5) / nh) * len);
    const kind = KINDS[(n - 1 + i) % 3];

  else {
    const ang = rand(0, TAU), d = rand(300, 420);
    l = L.l + Math.cos(ang) * d; p = L.p + Math.sin(ang) * d;
    const lat = lv.lat(p);
    l = clamp(l, lat - PATH_HW - 160, lat + PATH_HW + 160);
    if (Math.hypot(l - L.l, p - L.p) < 240) p = L.p + (p > L.p ? 300 : -300);
  }
  G.monsters.push({ frenzy: 0, fzT: 0, fzA: 0, l, p, spd: boss ? 44 : Math.min(96, 40 + G.level * 3.5) * rand(0.9, 1.1), burn: 0, carry: null, carryT: 0, boss, sway: rand(0, TAU), alive: true, h: boss ? 92 : 34, fadeIn: 0 });

function updateMonster(m, dt) {

    const sp = m.spd * 2.4;
    m.l += Math.cos(m.fzA) * sp * dt; m.p += Math.sin(m.fzA) * sp * dt;
    m.tgt = { l: m.l + Math.cos(m.fzA) * 40, p: m.p + Math.sin(m.fzA) * 40 };
    m.reach = 0.5 + 0.5 * Math.sin(G.time * 31 + m.sway);

  } else if (m.carry) {
    const dl = m.l - L.l, dp = m.p - L.p, d = Math.hypot(dl, dp) || 1;
    m.l += dl / d * 58 * dt; m.p += dp / d * 58 * dt;

  } else {

    m.reach = (m.reach || 0) + (want - (m.reach || 0)) * Math.min(1, dt * 2.5);
    let sp = m.spd;
    const dL = Math.hypot(m.l - L.l, m.p - L.p);
    if (dL < L.r) sp *= m.boss ? 0.35 : (G.level >= 3 ? 0.65 : 0.55);

// Holds ----------------------------------------------------------------------
function updateHold(h, dt) {
  if (h.done) return;
  const L = G.lantern;
  if (!h.active) {
    const near = G.villagers.some(v => (v.state === 'calm' || v.state === 'panic') && v.p > h.p - 170 && Math.abs(v.l - h.l) < PATH_HW + 60);
    if (near || Math.hypot(L.l - h.l, L.p - h.p) < 120) { h.active = true; h.t = 0; N.ev('hold_' + h.kind); sfx.boss(); G.shake = 4; }
    return;
  }
  h.t += dt;
  if (h.kind === 'gate') {
    if (Math.hypot(L.l - h.l, L.p - h.p) < 48) { h.progress += dt / h.secs; if (Math.random() < dt * 6) ember(h.l + rand(-6, 6), h.p + rand(-6, 6), rand(10, 24)); }
  } else {
    // keep the crew filled from calm villagers nearest the obstacle
    h.workers = h.workers.filter(v => v.state === 'calm' && v.job === h);
    if (h.workers.length < h.need && Math.floor(h.t * 2) !== Math.floor((h.t - dt) * 2)) {
      const cands = G.villagers.filter(v => v.state === 'calm' && !v.job && !v.lure).sort((a, b) => Math.hypot(a.l - h.l, a.p - h.p) - Math.hypot(b.l - h.l, b.p - h.p));
      for (const v of cands) {
        if (h.workers.length >= h.need) break;
        const used = h.workers.map(w => w.spot);
        v.spot = [0, 1, 2].find(i => i < h.spots.length && !used.includes(i));
        v.job = h; h.workers.push(v);
      }
    }
    const working = h.workers.filter(v => v.working).length;
    h.progress += dt * working / (h.need * h.secs);
    if (working && Math.floor(h.t * 3) !== Math.floor((h.t - dt) * 3)) sfx.nip();
  }
  if (h.progress >= 1) {
    h.done = true; h.progress = 1;
    for (const v of h.workers) { v.job = null; v.working = false; }
    h.workers = [];
    N.ev('done_' + h.kind); sfx.arrive(); G.shake = 5;
    for (let i = 0; i < 20; i++) burst(h.l + rand(-PATH_HW, PATH_HW), h.p, 6, '#6a5a3a', 1, 70, 3);
  }
}

// Dogs -----------------------------------------------------------------------
function updateDog(d, dt) {
  const L = G.lantern;
  d.cool = Math.max(0, d.cool - dt);
  let target = null, best = -1;
  for (const v of G.villagers) {
    if (v.state !== 'calm' && v.state !== 'panic') continue;
    if (v.job && !v.job.done) continue;
    const dl = Math.hypot(v.l - L.l, v.p - L.p);
    if (dl > L.r * 0.7 && dl < sight() * 1.6 && dl > best) { best = dl; target = v; }
  }
  let tx, ty;
  if (target) { tx = target.l; ty = target.p; }
  else { tx = L.l + Math.cos(G.time * 0.8 + d.id) * 40; ty = L.p + Math.sin(G.time * 0.8 + d.id) * 40 + 30; }
  const dl = tx - d.l, dp = ty - d.p, dd = Math.hypot(dl, dp) || 1;

    target.pl += pl / pd * 170; target.pp += pp / pd * 170;
    target.fear = Math.max(0, target.fear - 0.45);

// Particles & floating text ---------------------------------------------------

  }
}
function ember(l, p, h) {

}

// Flow -----------------------------------------------------------------------
function startGame() {
  G.level = 0; G.coins = 0;
  G.up = { lantern: 0, bell: 0, courage: 0, torch: 0, dog: 0, salt: 0 };
  G.endingShown = false; G.dread = 0;
  G.villagers = []; nameBag = [];
  for (let i = 0; i < 6; i++) G.villagers.push(makeVillager());
  N.reset();
  startLevel();
}
function startLevel() {
  G.level++;
  G.lv = genLevel(G.level); G.seed = G.level * 31;
  G.villagers = G.villagers.filter(v => v.state === 'safe' || G.level === 1);
  const recruits = G.level === 1 ? 0 : Math.min(G.level <= 5 ? 3 : 2, 28 - G.villagers.length);
  for (let i = 0; i < recruits; i++) G.villagers.push(makeVillager());
  N.mem.seen = (N.mem.seen || 0) + (G.level === 1 ? G.villagers.length : recruits);
  // torchbearers
  let torches = G.villagers.filter(v => v.torch).length;
  for (const v of G.villagers) { if (torches >= G.up.torch) break; if (!v.torch) { v.torch = true; torches++; } }
  placeFlock();
  G.monsters = []; G.salts = []; G.parts = []; G.texts = [];
  G.dogs = []; for (let i = 0; i < G.up.dog; i++) G.dogs.push({ id: i, l: G.lv.start.l + rand(-30, 30), p: 40 + i * 10, vl: 0, vp: 0, walk: 0, cool: 0 });
  G.saltLeft = G.up.salt;
  G.delivered = 0; G.lostLevel = 0; G.levelT = 0; G.spawnT = 4; G.idleT = 0; G.fastT = 0; G.slowSaid = false; G.bossSaid = false;
  G.maxMon = 2 + Math.floor(G.level * 1.2);
  G.oil = 1; G.oilSaid = 0; G.gust = { next: rand(22, 34), phase: 'calm', t: 0 }; G.callT = rand(6, 10); G.whisperT = 6;
  G.lastLiving = living().length;
  cam.l = G.lv.start.l; cam.p = 100;
  G.lantern.r = R(); G.lantern.core = R() * 0.62;
  G.state = 'play'; paused = false;
  if (G.level === 10) N.mem.seen = 0;
  N.ev('levelstart', { level: G.level, n: G.villagers.length, boss: G.lv.boss });
  if (G.lv.boss) spawnMonster(true);
}
function completeLevel() {
  G.state = 'arrive'; G.arriveT = 0;
  sfx.arrive();
  N.mem.levels++;
  if (G.level === 9 && !G.endingShown) {
    const seen = N.mem.seen || 1, lost = N.mem.lost;
    N.ev('ending', { kind: lost === 0 ? 'none' : lost < seen / 3 ? 'few' : 'many', d: G.delivered });
  } else {
    N.ev('dawn', { level: G.level });
    if (G.lostLevel === 0) { G.coins += 20; N.mem.perfect++; N.ev('perfect'); }
    else N.ev('partial', { d: G.delivered, l: G.lostLevel });
  }
  if (G.lostLevel === 0 && G.level === 9 && !G.endingShown) { G.coins += 20; N.mem.perfect++; }
  if (G.level > G.best) { G.best = G.level; store.set('ln_best', G.best); }
}
function gameOver() {
  G.state = 'over'; sfx.lose(); setDrone(0);
  N.ev('gameover');
  if (G.level - 1 > G.best) { G.best = G.level - 1; store.set('ln_best', G.best); }
}
function pause() { if (G.state === 'play') { paused = true; N.ev('pause'); } }
function buyUpgrade(u) {
  const c = cost(u, G.up[u.id]);
  if (G.coins < c) { sfx.nope(); return; }
  G.coins -= c; G.up[u.id]++; sfx.buy();
  let v = null;
  if (u.id === 'torch') { v = G.villagers.find(x => !x.torch && x.state === 'safe'); if (v) v.torch = true; }
  N.ev('buy', { item: u.id, v: v || G.villagers[0] });
}
function onClick(x, y) {
  if (G.state === 'title') { G.state = 'intro'; G.introT = 0; return; }
  if (G.state === 'intro') { if (G.introT > 1.2) startGame(); return; }
  if (G.state === 'ending') { G.endingShown = true; G.state = 'shop'; return; }
  if (G.state === 'over') { G.state = 'title'; N.reset(); N.ev('title'); return; }
  if (G.state === 'arrive') { G.arriveT = 99; return; }
  if (G.state === 'shop') {
    const row = shopRowAt(x, y);
    if (row >= 0) buyUpgrade(UPGRADES[row]);
    else if (y > SHOP_BTN_Y && y < SHOP_BTN_Y + 56 && x > 120 && x < W - 120) startLevel();
    return;
  }
  if (G.state === 'play') {
    if (paused) { paused = false; return; }
    if (G.saltLeft > 0) {
      G.saltLeft--;
      G.salts.push({ l: G.lantern.l, p: G.lantern.p, r: 58, t: 9, max: 9 });
      sfx.salt(); N.ev('salt');
    } else N.ev('nosalt');
  }
}
const SHOP_TOP = 180, SHOP_ROW = 84, SHOP_BTN_Y = SHOP_TOP + 6 * SHOP_ROW + 30;
function shopRowAt(x, y) {
  if (x < 30 || x > W - 30) return -1;
  const i = Math.floor((y - SHOP_TOP) / SHOP_ROW);
  return i >= 0 && i < UPGRADES.length ? i : -1;
}

// ---------------------------------------------------------------------------
// Update
// ---------------------------------------------------------------------------
function update(dt) {
  G.time += dt;
  N.update(dt);
  if (actx) music.update(dt);
  // lantern follows the pointer (ground point under the pointer)
  const L = G.lantern;
  const g = toGround(pointer.x, pointer.y);

    text(`${G.villagers.filter(v => v.state === 'safe').length} villagers · ${G.level < 5 ? 3 : 2} more will join at dawn`, W / 2, 108, 15, 'rgba(207,198,176,0.75)', 'center', 500);
    ctx.fillStyle = '#ffd27a'; ctx.beginPath(); ctx.arc(W / 2 - 30, 145, 7, 0, TAU); ctx.fill();
    text(`${G.coins}`, W / 2 - 16, 145, 22, '#ffd27a', 'left', 900);
    UPGRADES.forEach((u, i) => {
      const y = SHOP_TOP + i * SHOP_ROW;
      const lv = G.up[u.id], c = cost(u, lv), can = G.coins >= c;
      const hover = pointer.x > 30 && pointer.x < W - 30 && pointer.y > y && pointer.y < y + SHOP_ROW - 6;
      ctx.fillStyle = hover ? 'rgba(255,220,160,0.08)' : 'rgba(255,255,255,0.03)'; ctx.fillRect(30, y, W - 60, SHOP_ROW - 6);
      drawUpgradeIcon(u.id, 62, y + 39);
      text(u.name + (lv ? ` ×${lv}` : ''), 98, y + 26, 18, '#e8dcc0', 'left', 800);
      text(u.desc, 98, y + 52, 13, 'rgba(207,198,176,0.7)', 'left', 500);
      ctx.fillStyle = can ? 'rgba(255,210,120,0.18)' : 'rgba(255,255,255,0.05)';
      ctx.fillRect(W - 128, y + 22, 90, 36);
      text(`${c}`, W - 83, y + 40, 18, can ? '#ffd27a' : 'rgba(207,198,176,0.4)', 'center', 900);
    });
    const hb = pointer.y > SHOP_BTN_Y && pointer.y < SHOP_BTN_Y + 56 && pointer.x > 120 && pointer.x < W - 120;
    ctx.fillStyle = hb ? 'rgba(255,210,120,0.3)' : 'rgba(255,210,120,0.18)'; ctx.fillRect(120, SHOP_BTN_Y, W - 240, 56);
    text('Walk on', W / 2, SHOP_BTN_Y + 28, 22, '#ffd27a', 'center', 900);
    return;
  }
  if (G.state === 'over') {
    ctx.fillStyle = 'rgba(4,5,12,0.75)'; ctx.fillRect(0, 0, W, H - PANEL_H);
    text('No one left', W / 2, 300, 48, '#e8dcc0', 'center', 900, 'Georgia, serif');
    text(`You reached night ${G.level}.`, W / 2, 360, 20, '#cfc6b0', 'center', 500);
    text(`${N.mem.lost} lost · ${N.mem.taken} taken · ${N.mem.fell} fell · ${N.mem.rescues} pulled back`, W / 2, 392, 15, 'rgba(207,198,176,0.7)', 'center', 500);
    if (G.best) text(`best: night ${G.best}`, W / 2, 424, 15, 'rgba(207,198,176,0.6)', 'center', 600);
    text('click to try again', W / 2, 500, 18, `rgba(255,210,120,${0.6 + 0.4 * Math.sin(G.time * 3)})`, 'center', 700);
    return;
  }
  if (paused) {
    ctx.fillStyle = 'rgba(4,5,12,0.6)'; ctx.fillRect(0, 0, W, H - PANEL_H);
    text('Paused', W / 2, 380, 40, '#e8dcc0', 'center', 900, 'Georgia, serif');
    text('click or P to continue', W / 2, 430, 16, 'rgba(207,198,176,0.7)', 'center', 600);
  }
}
function drawUpgradeIcon(id, x, y) {
  ctx.save(); ctx.translate(x, y);
  if (id === 'lantern') { ctx.fillStyle = '#2a241c'; ctx.fillRect(-7, -10, 14, 20); ctx.fillStyle = '#ffb45a'; ctx.fillRect(-4, -6, 8, 12); }
  else if (id === 'bell') { poly([[-9, 6], [9, 6], [5, -8], [-5, -8]], '#c9a05a'); ctx.fillStyle = '#8a6a2a'; ctx.beginPath(); ctx.arc(0, 8, 3, 0, TAU); ctx.fill(); }
  else if (id === 'courage') { ctx.fillStyle = '#c05a5a'; ctx.beginPath(); ctx.moveTo(0, 9); ctx.bezierCurveTo(-12, -2, -6, -12, 0, -5); ctx.bezierCurveTo(6, -12, 12, -2, 0, 9); ctx.fill(); }
  else if (id === 'torch') { ctx.fillStyle = '#3a2a1a'; ctx.fillRect(-2, -2, 4, 14); poly([[-6, -2], [6, -2], [0, -14]], '#ff8a2a'); poly([[-3, -2], [3, -2], [0, -9]], '#ffd27a'); }
  else if (id === 'dog') { ctx.fillStyle = '#8a6a3a'; ctx.fillRect(-10, -2, 16, 9); ctx.fillRect(2, -9, 9, 8); ctx.fillStyle = '#5a4a2a'; ctx.fillRect(3, -11, 3, 4); }
  else if (id === 'salt') { ctx.strokeStyle = '#e8e8ff'; ctx.lineWidth = 2; ctx.setLineDash([3, 3]); ctx.beginPath(); ctx.ellipse(0, 0, 11, 6, 0, 0, TAU); ctx.stroke(); }
  ctx.restore();
}
function render() {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = '#06070e'; ctx.fillRect(0, 0, cv.width / dpr, cv.height / dpr);
  ctx.setTransform(scale * dpr, 0, 0, scale * dpr, offX * dpr, offY * dpr);
  ctx.save();
  ctx.beginPath(); ctx.rect(0, 0, W, H); ctx.clip();
  if (G.shake > 0) ctx.translate(rand(-G.shake, G.shake), rand(-G.shake, G.shake) * 0.5);
  drawWorld();
  ctx.restore();
  ctx.save(); ctx.beginPath(); ctx.rect(0, 0, W, H); ctx.clip();
  if (G.state !== 'title' && G.state !== 'shop' && G.state !== 'intro' && G.state !== 'ending') drawHUD();
  drawOverlay();
  drawNarrator();
  ctx.restore();
}

// ---------------------------------------------------------------------------
// Boot: title screen shows night 1 with the villagers waiting at the door
// ---------------------------------------------------------------------------
function bootTitle() {
  G.level = 1; G.lv = genLevel(1); G.seed = 31;
  G.villagers = []; for (let i = 0; i < 6; i++) G.villagers.push(makeVillager());
  placeFlock();
  G.monsters = []; G.dogs = []; G.salts = [];
  cam.l = G.lv.start.l; cam.p = 110;
  G.lantern.r = R(); G.lantern.core = R() * 0.62;
  N.reset(); N.ev('title');
}
bootTitle();

// ---------------------------------------------------------------------------
// Main loop (fixed 60Hz simulation)
// ---------------------------------------------------------------------------
const STEP = 1 / 60;
let last = performance.now(), acc = 0;
function frame(now) {
  let dt = (now - last) / 1000; last = now;
  if (dt > 0.1) dt = 0.1;
  if (!paused) {
    acc += dt;
    while (acc >= STEP) { update(STEP); acc -= STEP; }
  }
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// Small debug/QA hook (harmless in production)
window.__lantern = { G, N, cam, pointer, holdActive, music, initAudio, audio: () => actx, step: n => { for (let i = 0; i < n; i++) update(STEP); render(); }, start: startGame, startLevel, completeLevel, buy: buyUpgrade, UPGRADES, cost, R, sight };
})();
</script>
